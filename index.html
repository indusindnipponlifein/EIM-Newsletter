<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDRT Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6E1423;
  --maroon-deep:#4A0F1C;
  --red:#C8323F;
  --red-error:#A11A2B;
  --grey:#5B534F;
  --grey-soft:#8C8582;
  --line:#E4DFDD;
  --paper:#FFFFFF;
  --success:#2A7F5F;
  --card-top:33vh;   /* how far down the card starts; change this to move it */
  --font-display:'Instrument Serif', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
html{scrollbar-gutter:stable;}
body{
  position:relative;min-height:100vh;min-height:100svh;overflow-x:hidden;
  font-family:var(--font-body);color:var(--grey);
  background:var(--maroon-deep);
}

/* ---------- Background image ----------
   Replace the src of the <img> below with your own image.
   It fills the screen (cover) and is softened by a maroon scrim so the card always reads clearly. */
.bg-photo{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--maroon) 0%,var(--maroon-deep) 100%);}
.bg-photo img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block;}
.bg-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(74,15,28,0) 0%, rgba(74,15,28,0) 55%, rgba(35,8,17,.35) 100%);
}

/* ---------- Layout ---------- */
.stage{
  position:relative;z-index:2;min-height:100vh;min-height:100svh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:var(--card-top) 20px 48px;
}
.card{
  position:relative;width:100%;max-width:420px;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:14px;overflow:hidden;
  padding:36px 30px 30px;text-align:center;
  box-shadow:0 22px 50px rgba(20,4,9,.35);
  animation:rise .7s ease both;
}
.card::before{ /* thin brand bar */
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--maroon) 0%,var(--maroon) 70%,var(--red) 100%);
}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}


.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.subcopy{font-size:15px;line-height:1.55;color:var(--grey);max-width:320px;margin:0 auto 20px;}

/* ---------- Form ---------- */
.input-wrap{margin-bottom:14px;}
input{
  display:block;width:100%;padding:14px 16px;font-size:16px;font-family:var(--font-body);color:var(--maroon-deep);
  background:#FAF8F8;border:1px solid var(--line);border-radius:8px;outline:none;text-align:center;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input::placeholder{color:var(--grey-soft);}
input:focus{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 3px rgba(110,20,35,.12);}

button{
  width:100%;padding:14px;border:none;border-radius:8px;cursor:pointer;
  background:var(--maroon);color:#fff;
  font-family:var(--font-body);font-weight:600;font-size:16px;letter-spacing:.02em;
  transition:background .2s ease;
}
button:hover{background:var(--red);}
button:disabled{opacity:.6;cursor:not-allowed;background:var(--maroon);}
button:focus-visible, input:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

.loader{
  display:none;margin-top:16px;align-items:center;justify-content:center;gap:8px;
  font-size:14px;color:var(--grey);
}
.loader.show{display:flex;}
.spinner{
  width:14px;height:14px;border:2px solid rgba(110,20,35,.18);border-top-color:var(--maroon);
  border-radius:50%;display:inline-block;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#msg{margin-top:14px;text-align:center;font-weight:500;font-size:15px;}
#msg:empty{margin-top:0;}
.success{color:var(--success);}
.nl-title{color:var(--grey);font-weight:500;font-size:14px;margin-bottom:10px;}
.open-link{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#FAF8F8;color:var(--maroon);font-weight:600;text-decoration:none;}
.open-link:hover{border-color:var(--maroon);}
.nl-date{font-weight:400;font-size:13px;color:var(--grey-soft);white-space:nowrap;}
.error{color:var(--red-error);}


@media (max-width:480px){
  .stage{padding:var(--card-top) 14px 40px;}
  .card{padding:30px 22px 22px;}
  }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="bg-photo" aria-hidden="true">
  <!-- Replace this src with your background image -->
  <img src="https://imgh.in/host/3bsqy4" alt="">
  <div class="bg-overlay"></div>
</div>

<main class="stage">
  <section class="card">

    <h1 class="sr-only">EIM Newsletter</h1>
    <p class="subcopy">Enter your details below to view recent Newsletter</p>

    <div class="input-wrap">
      <input
        id="input"
        placeholder="Advisor code"
        autocomplete="off"
      >
    </div>
    <button onclick="searchDoc()" id="btn">Click to view!</button>

    <div class="loader" id="loader"><span class="spinner"></span><span>Searching...</span></div>
    <div id="msg"></div>

  </section>
</main>

<script>
// Upload date shown on each newsletter button. Edit these in the HTML whenever a newsletter is updated.
// Leave a value as "" to show no date for that newsletter.
const NL_DATES={
  NL_1:"16/10/2026",
  NL_2:"30/10/2026",
  NL_3:"",
  NL_4:"",
  NL_5:"",
  NL_6:""
};

const API_URL="https://script.google.com/macros/s/AKfycbwVg4TFhhk--gzRg_k9aPW6h7lliAwj0sEy0bkEo_Nb3aM8IwhNhu4W3bBuiVrLaYQ/exec";

async function searchDoc(){
  const value=document.getElementById("input").value.trim();
  const msg=document.getElementById("msg");
  const loader=document.getElementById("loader");
  const btn=document.getElementById("btn");
  msg.innerHTML="";
  if(value===""){
    msg.className="error";
    msg.innerHTML="Please enter your L1 code, Employee ID or Mobile Number.";
    return;
  }
  loader.classList.add("show");
  btn.disabled=true;
  try{
    const response=await fetch(API_URL+"?input="+encodeURIComponent(value));
    const data=await response.json();
    loader.classList.remove("show");
    btn.disabled=false;
    if(data.status==="success"){
      msg.className="success";
      msg.innerHTML="";
      const items=Object.keys(data.newsletters||{}).sort();
      if(items.length===0){
        msg.className="error";
        msg.textContent="No newsletters available yet.";
      }else{
        const title=document.createElement("div");
        title.className="nl-title";
        title.textContent="Tap to open your newsletters";
        msg.appendChild(title);
        items.forEach(function(key){
          const a=document.createElement("a");
          a.href=data.newsletters[key];a.target="_blank";a.rel="noopener";a.className="open-link";
          const name=document.createElement("span");
          name.textContent="Newsletter "+key.replace("NL_","");
          a.appendChild(name);
          if(NL_DATES[key]){
            const d=document.createElement("span");
            d.className="nl-date";
            d.textContent=NL_DATES[key];
            a.appendChild(d);
          }
          msg.appendChild(a);
        });
      }
    }else{
      msg.className="error";
      msg.innerHTML=data.message;
    }
  }catch(err){
    loader.classList.remove("show");
    btn.disabled=false;
    msg.className="error";
    msg.innerHTML="Unable to connect to server.";
  }
}
</script>
</body>
</html>
