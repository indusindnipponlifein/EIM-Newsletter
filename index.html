<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0F1C">
<title>Newsletter Showcase</title>

<style>
:root {
  --maroon: #6E1423;
  --maroon-dark: #4A0F1C;
  --red: #C8323F;
  --text: #292326;
  --grey: #6B6567;
  --line: #E4DFDD;
  --soft: #F7F1F2;
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  background-color: var(--maroon-dark);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* Background image: fixed layer (works on iOS too) with a dark fade
   toward the bottom so the cards stay readable */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: var(--maroon-dark);
  background-image:
    linear-gradient(180deg,
      rgba(42, 7, 16, 0.05) 0%,
      rgba(42, 7, 16, 0.25) 45%,
      rgba(42, 7, 16, 0.65) 100%),
    url("https://d2bja440mdt72x.cloudfront.net/thailand-letters/PPTapotrait.png");
  background-position: center top;
  background-repeat: no-repeat;
  background-size: cover;
}

button, input { font: inherit; }

.page {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding: 0 18px 40px;
}

.main {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-top: 56vh;
  padding-top: 56dvh;
}

/* ---------- Search panel ---------- */

.search-panel {
  position: relative;
  width: 100%;
  padding: 28px 26px 26px;
  border-radius: 12px;
  border-top: 4px solid var(--maroon);
  background: rgba(255, 255, 255, 0.95);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow:
    0 24px 60px rgba(20, 4, 9, 0.35),
    0 2px 6px rgba(20, 4, 9, 0.15);
}

.panel-intro {
  margin: 0 0 22px;
  color: #4B4447;
  font-size: 14.5px;
  line-height: 1.65;
  max-width: 52ch;
}

.input-label {
  display: block;
  margin-bottom: 8px;
  color: var(--maroon-dark);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.input-row {
  display: flex;
  align-items: stretch;
  gap: 10px;
}

.input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.input-wrap svg {
  position: absolute;
  top: 50%;
  left: 14px;
  width: 18px;
  height: 18px;
  transform: translateY(-50%);
  stroke: #9A9093;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.input-wrap input {
  width: 100%;
  height: 50px;
  padding: 0 14px 0 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  background: #FFFFFF;
  color: var(--text);
  font-size: 15px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-wrap input:focus {
  border-color: var(--maroon);
  box-shadow: 0 0 0 4px rgba(110, 20, 35, 0.12);
}

.input-wrap input::placeholder {
  color: #8C8386;
  opacity: 1;
}

.input-row button {
  flex-shrink: 0;
  min-width: 150px;
  height: 50px;
  padding: 0 20px;
  border: 0;
  border-radius: 8px;
  background: linear-gradient(180deg, #7D1829 0%, var(--maroon) 100%);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(110, 20, 35, 0.3);
  transition: background 0.2s ease, box-shadow 0.2s ease;
}

.input-row button:hover {
  background: linear-gradient(180deg, #D23B48 0%, var(--red) 100%);
  box-shadow: 0 8px 18px rgba(200, 50, 63, 0.35);
}

.input-row button:focus-visible,
.open-link:focus-visible {
  outline: 3px solid #E9A7AE;
  outline-offset: 2px;
}

.input-row button:disabled {
  opacity: 0.65;
  cursor: wait;
}

/* ---------- Status ---------- */

.status {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.status.visible { display: block; }

.status.success {
  background: #EAF5EF;
  border: 1px solid #C8E5D4;
  color: #1F5F42;
}

.status.success::before { content: "✓ "; font-weight: 700; }

.status.error {
  background: #FBEDEE;
  border: 1px solid #F1CDD1;
  color: #9B1C2B;
}

.status.error::before { content: "! "; font-weight: 700; }

/* ---------- Newsletter results ---------- */

.newsletter-section {
  display: none;
  width: 100%;
  margin: 18px auto 0;
  scroll-margin-top: 16px;
}

.newsletter-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 55vh;
  max-height: 55dvh;
  overflow-y: auto;
  padding: 3px 6px 8px 3px;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.75) rgba(255,255,255,.15);
}

.newsletter-list::-webkit-scrollbar { width: 6px; }
.newsletter-list::-webkit-scrollbar-track { background: rgba(255,255,255,.15); border-radius: 10px; }
.newsletter-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.75); border-radius: 10px; }

.newsletter-item {
  flex: 0 0 auto;
  padding: 18px 20px;
  border-left: 4px solid var(--maroon);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 10px 26px rgba(20, 4, 9, 0.22);
}

.newsletter-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.newsletter-item h3 {
  margin: 0;
  color: var(--maroon);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
}

.newsletter-tag {
  flex-shrink: 0;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--maroon);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.newsletter-date {
  margin: 8px 0 0;
  color: var(--grey);
  font-size: 13px;
}

.open-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
  padding: 11px 18px;
  border-radius: 8px;
  background: var(--maroon);
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.2s ease;
}

.open-link:hover { background: var(--red); }

/* ---------- Mobile ---------- */

@media (max-width: 520px) {
  .page { padding-right: 12px; padding-left: 12px; }
  .search-panel { padding: 22px 18px 20px; }
  .panel-intro { font-size: 14px; margin-bottom: 18px; }
  .input-row { flex-direction: column; gap: 10px; }
  .input-row button { width: 100%; }
  .newsletter-list { max-height: 48vh; max-height: 48dvh; }
  .newsletter-item { padding: 16px; }
  .newsletter-item h3 { font-size: 21px; }
}

@media (max-height: 600px) {
  .main { padding-top: 46vh; padding-top: 46dvh; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>

<body>
<div class="page">
  <main class="main">

    <section class="search-panel">
      <p class="panel-intro">
        Enter your Employee ID or registered mobile number
        to find and access your available newsletters.
      </p>

      <form id="searchForm">
        <div class="input-row">
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="8" r="4"></circle>
              <path d="M4 20c0-3.5 3.1-6 7-6s7 2.5 7 6"></path>
            </svg>
            <input
              type="text"
              id="employeeInput"
              name="input"
              placeholder="Employee ID / Mobile Number"
              autocomplete="off"
              aria-label="Employee ID or Mobile Number"
              required
            >
          </div>

          <button type="submit" id="searchButton">
            Find Newsletters
          </button>
        </div>
      </form>

      <div
        class="status"
        id="statusMessage"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <section
      class="newsletter-section"
      id="newsletterSection"
      aria-label="Available newsletters"
    >
      <div class="newsletter-list" id="newsletterList"></div>
    </section>

  </main>
</div>

<script>
/* Replace with your deployed Apps Script URL ending in /exec. */
const API_URL = "https://script.google.com/macros/s/AKfycbwVg4TFhhk--gzRg_k9aPW6h7lliAwj0sEy0bkEo_Nb3aM8IwhNhu4W3bBuiVrLaYQ/exec";

/* Edit newsletter dates here. */
const NEWSLETTER_DATES = {
  NL_1: "01 October 2026",
  NL_2: "15 October 2026",
  NL_3: "01 November 2026",
  NL_4: "15 November 2026",
  NL_5: "01 December 2026",
  NL_6: "15 December 2026"
};

const NEWSLETTER_TITLES = {
  NL_1: "Newsletter 1",
  NL_2: "Newsletter 2",
  NL_3: "Newsletter 3",
  NL_4: "Newsletter 4",
  NL_5: "Newsletter 5",
  NL_6: "Newsletter 6"
};

const NEWSLETTER_KEYS = [
  "NL_1", "NL_2", "NL_3",
  "NL_4", "NL_5", "NL_6"
];

const searchForm = document.getElementById("searchForm");
const employeeInput = document.getElementById("employeeInput");
const searchButton = document.getElementById("searchButton");
const statusMessage = document.getElementById("statusMessage");
const newsletterSection = document.getElementById("newsletterSection");
const newsletterList = document.getElementById("newsletterList");

let activeScript = null;
let requestTimer = null;
let requestId = 0;

function setStatus(message, type) {
  statusMessage.textContent = message;
  statusMessage.className = "status visible";

  if (type) {
    statusMessage.classList.add(type);
  }
}

function clearResults() {
  newsletterList.replaceChildren();
  newsletterSection.style.display = "none";
}

function getValidNewsletterUrl(value) {
  const url = String(value || "").trim();

  if (!url) return "";

  try {
    const parsed = new URL(url);

    if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
      return "";
    }

    return parsed.href;
  } catch (error) {
    return "";
  }
}

function renderNewsletters(newsletters) {
  newsletterList.replaceChildren();

  const available = NEWSLETTER_KEYS.filter(function(key) {
    return getValidNewsletterUrl(newsletters[key]) !== "";
  });

  if (available.length === 0) {
    newsletterSection.style.display = "none";

    setStatus(
      "Your record was found, but no newsletter links are currently available.",
      "error"
    );
    return;
  }

  available.forEach(function(key) {
    const url = getValidNewsletterUrl(newsletters[key]);

    const item = document.createElement("article");
    item.className = "newsletter-item";

    const top = document.createElement("div");
    top.className = "newsletter-item-top";

    const title = document.createElement("h3");
    title.textContent = NEWSLETTER_TITLES[key] || key;

    const tag = document.createElement("span");
    tag.className = "newsletter-tag";
    tag.textContent = key.replace("_", " ");

    top.appendChild(title);
    top.appendChild(tag);

    const date = document.createElement("p");
    date.className = "newsletter-date";
    date.textContent =
      "Newsletter date: " +
      (NEWSLETTER_DATES[key] || "Date to be announced");

    const link = document.createElement("a");
    link.className = "open-link";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open Newsletter ↗";

    item.appendChild(top);
    item.appendChild(date);
    item.appendChild(link);

    newsletterList.appendChild(item);
  });

  newsletterSection.style.display = "block";

  setStatus(
    available.length +
      " newsletter" +
      (available.length === 1 ? "" : "s") +
      " found. Your available publications are listed below.",
    "success"
  );

  newsletterSection.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}

function cleanupRequest() {
  if (activeScript) {
    activeScript.remove();
    activeScript = null;
  }

  if (requestTimer) {
    clearTimeout(requestTimer);
    requestTimer = null;
  }

  delete window.newsletterResponse;
}

function handleResponse(data, currentRequestId) {
  if (currentRequestId !== requestId) return;

  cleanupRequest();

  searchButton.disabled = false;
  searchButton.textContent = "Find Newsletters";

  if (!data || typeof data !== "object") {
    setStatus("The server returned an invalid response. Please try again.", "error");
    return;
  }

  if (data.status !== "success") {
    setStatus(
      data.message || "Unable to retrieve newsletters. Please try again.",
      "error"
    );
    return;
  }

  renderNewsletters(data.newsletters || {});
}

searchForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const input = employeeInput.value.trim();

  if (!input) {
    setStatus("Please enter your Employee ID or Mobile Number.", "error");
    employeeInput.focus();
    return;
  }

  if (!API_URL || API_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
    setStatus("Please configure the Apps Script URL in the HTML.", "error");
    return;
  }

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(API_URL)) {
    setStatus("Please enter a valid deployed Apps Script URL ending in /exec.", "error");
    return;
  }

  requestId++;
  const currentRequestId = requestId;

  cleanupRequest();
  clearResults();

  searchButton.disabled = true;
  searchButton.textContent = "Searching...";
  setStatus("Checking your details and finding your newsletters...", "");

  window.newsletterResponse = function(data) {
    handleResponse(data, currentRequestId);
  };

  const separator = API_URL.includes("?") ? "&" : "?";

  activeScript = document.createElement("script");
  activeScript.src =
    API_URL +
    separator +
    "input=" + encodeURIComponent(input) +
    "&callback=newsletterResponse" +
    "&_=" + Date.now();

  activeScript.onerror = function() {
    if (currentRequestId !== requestId) return;

    cleanupRequest();

    searchButton.disabled = false;
    searchButton.textContent = "Find Newsletters";

    setStatus(
      "Unable to connect to the server. Check your Apps Script deployment and try again.",
      "error"
    );
  };

  requestTimer = setTimeout(function() {
    if (currentRequestId !== requestId) return;

    cleanupRequest();

    searchButton.disabled = false;
    searchButton.textContent = "Find Newsletters";

    setStatus("The request timed out. Please try again.", "error");
  }, 20000);

  document.body.appendChild(activeScript);
});
</script>
</body>
</html>
